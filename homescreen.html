<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chime — Home</title>
  <!-- Modern Clean Font Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #111827;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 68px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e5e7eb;
      z-index: 100;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111827;
    }

    /* Top-right Menu Button */
    .menu-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      transition: background-color 0.2s ease;
    }

    .menu-btn:hover {
      background-color: #f3f4f6;
    }

    .menu-btn span {
      display: block;
      width: 24px;
      height: 2.5px;
      background-color: #111827;
      border-radius: 2px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    /* Sidebar Overlay */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(17, 24, 39, 0.25);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 190;
    }

    .sidebar-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 270px;
      height: 100vh;
      background-color: #ffffff;
      border-left: 1px solid #e5e7eb;
      box-shadow: -8px 0 28px rgba(0, 0, 0, 0.06);
      padding: 24px;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 200;
      display: flex;
      flex-direction: column;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .sidebar-brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111827;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      color: #6b7280;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .close-btn:hover {
      background-color: #f3f4f6;
      color: #111827;
    }

    /* Sidebar Navigation Links */
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #4b5563;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 14px;
      border-radius: 12px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .nav-item:hover {
      background-color: #f9fafb;
      color: #111827;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .nav-item.active {
      color: #111827;
    }

    .nav-item.active .nav-label {
      position: relative;
      display: inline-block;
      padding-bottom: 6px;
    }

    .nav-item.active .nav-label::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background-color: #2563eb;
      border-radius: 999px;
    }

    .nav-item.premium-link {
      color: #b45309;
    }

    .nav-item.premium-link:hover {
      background-color: #fffbeb;
      color: #92400e;
    }

    /* Homescreen Feed */
    .feed-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 96px 20px 120px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .feed-section-label {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 2px;
    }

    .post-card {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 20px 22px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .post-card:hover {
      border-color: #d1d5db;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .author-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .author-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    .author-meta {
      display: flex;
      flex-direction: column;
    }

    .author-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .author-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: #111827;
    }

    .official-tag {
      font-size: 0.7rem;
      font-weight: 700;
      background-color: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .post-date {
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 2px;
    }

    .post-body {
      font-size: 1rem;
      line-height: 1.6;
      color: #1f2937;
      word-break: break-word;
    }

    /* Floating Center Create Button (FAB) */
    .fab-create {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 90;
    }

    .fab-create:hover {
      background-color: #1d4ed8;
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.42);
    }

    .fab-create:active {
      transform: translateX(-50%) translateY(0);
    }

    .fab-create svg {
      width: 28px;
      height: 28px;
      stroke-width: 2.5;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <span class="header-title">Chime</span>
    <button id="open-menu-btn" class="menu-btn" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <div class="sidebar-header">
      <span class="sidebar-brand">Chime</span>
      <button id="close-menu-btn" class="close-btn" aria-label="Close menu">&times;</button>
    </div>

    <nav>
      <ul class="nav-list">
        <li>
          <a href="homescreen.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z" />
            </svg>
            <span class="nav-label">Home</span>
          </a>
        </li>
        <li>
          <a href="profile.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
            </svg>
            <span class="nav-label">Profile</span>
          </a>
        </li>
        <li>
          <a href="assets.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
            <span class="nav-label">Asset Store</span>
          </a>
        </li>
        <li>
          <a href="premium.html" class="nav-item premium-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
            <span class="nav-label">Membership</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Homescreen Feed -->
  <main class="feed-container">
    <div class="feed-section-label">Latest Feed</div>

    <!-- CCYW First Post -->
    <article class="post-card">
      <div class="post-header">
        <div class="author-info">
          <div class="author-avatar">CCYW</div>
          <div class="author-meta">
            <div class="author-name-row">
              <span class="author-name">CCYW</span>
              <span class="official-tag">Official</span>
            </div>
            <span class="post-date">November 14, 2026</span>
          </div>
        </div>
      </div>
      <div class="post-body">
        Welcome to the first ever post on this homescreen! This post contains text.
      </div>
    </article>
  </main>

  <!-- Floating Create Button -> links to create1.html -->
  <a href="create1.html" class="fab-create" aria-label="Create">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </a>

  <script>
    const openMenuBtn = document.getElementById('open-menu-btn');
    const closeMenuBtn = document.getElementById('close-menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('open');
      sidebar.setAttribute('aria-hidden', 'false');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      sidebar.setAttribute('aria-hidden', 'true');
    }

    openMenuBtn.addEventListener('click', openSidebar);
    closeMenuBtn.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);
  </script>

</body>
</html>
