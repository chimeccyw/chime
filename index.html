<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chime — Create your World</title>
  <!-- Smooth, modern geometric sans-serif font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ffffff;
      color: #111827;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Screen Container */
    .stage {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fade Transitions */
    .screen {
      position: absolute;
      width: 100%;
      padding: 0 24px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s;
      text-align: center;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* 1. Landing Logo Screen */
    .brand-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .brand-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #111827;
      margin-bottom: 6px;
    }

    .brand-tagline {
      font-size: 1.05rem;
      font-weight: 400;
      color: #6b7280;
      margin-bottom: 28px;
    }

    /* Buttons */
    .btn-green {
      background-color: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 13px 32px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn-green:hover {
      background-color: #059669;
      transform: translateY(-1px);
    }

    .btn-green:active {
      transform: translateY(0);
    }

    /* 2. Input Form Box */
    .card-box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
      text-align: left;
    }

    .card-box h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .card-box p {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      color: #111827;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-group input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .btn-full {
      width: 100%;
      margin-top: 8px;
    }

    /* 3. Loading Box */
    .loading-box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 40px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid #e5e7eb;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 1rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 4px;
    }

    .loading-sub {
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="stage">
    <!-- Step 1: Centered Logo & Green Login Button -->
    <div id="landing-screen" class="screen active">
      <img src="logo.png" alt="Chime Logo" class="brand-logo" />
      <div class="brand-title">Chime</div>
      <div class="brand-tagline">Create your World</div>
      <button id="start-login-btn" class="btn-green">Login</button>
    </div>

    <!-- Step 2: Account Input Box -->
    <div id="form-screen" class="screen">
      <div class="card-box">
        <h2>Welcome to Chime</h2>
        <p>Enter your details to create your world.</p>
        <form id="login-form">
          <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required />
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn-green btn-full">Continue</button>
        </form>
      </div>
    </div>

    <!-- Step 3: Loading Box -->
    <div id="loading-screen" class="screen">
      <div class="loading-box">
        <div class="spinner"></div>
        <div class="loading-text">Creating your world...</div>
        <div class="loading-sub">Signing you into Chime</div>
      </div>
    </div>
  </div>

  <script>
    const landingScreen = document.getElementById('landing-screen');
    const formScreen = document.getElementById('form-screen');
    const loadingScreen = document.getElementById('loading-screen');

    const startLoginBtn = document.getElementById('start-login-btn');
    const loginForm = document.getElementById('login-form');

    // Switch from Logo screen to Input Form box
    startLoginBtn.addEventListener('click', () => {
      landingScreen.classList.remove('active');
      setTimeout(() => {
        formScreen.classList.add('active');
      }, 200);
    });

    // Switch from Input Form box to Loading box, then redirect after 5 seconds
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      formScreen.classList.remove('active');
      setTimeout(() => {
        loadingScreen.classList.add('active');
      }, 200);

      setTimeout(() => {
        window.location.href = 'homescreen.html';
      }, 5000);
    });
  </script>

</body>
</html>
